bundle:
  name: tfnsw-data-lakehouse

include:
  - resources/*.yml

variables:
  catalog_name:
    description: Unity Catalog catalog for this environment
  storage_account_name:
    description: Azure storage account backing the raw landing volume

resources:
  environments:
    streaming_env:
      spec:
        client: "1"
        dependencies:
          - -r requirements.txt

targets:
  dev:
    default: true
    workspace:
      host: hhttps://adb-7405604559120126.6.azuredatabricks.net/
    variables:
      catalog_name: dev
      storage_account_name: azuredbstorage2030

  staging:
    workspace:
      host: https://<your-workspace>.azuredatabricks.net
    variables:
      catalog_name: staging
      storage_account_name: azuredbstorage2030

  prod:
    workspace:
      host: https://<your-workspace>.azuredatabricks.net
    variables:
      catalog_name: prod
      storage_account_name: azuredbstorage2030