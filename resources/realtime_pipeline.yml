resources:
  pipelines:
    tfnsw_ldp_realtime_pipeline:
      name: tfnsw_ldp_realtime_pipeline_${bundle.target}
      serverless: true
      catalog: ${var.catalog_name}
      target: ${var.schema_name}
      development: ${var.pipeline_dev_mode}
      libraries:
        - file:
            path: ../ldp_pipelines/realtime/silver.py
        - file:
            path: ../ldp_pipelines/realtime/gold.py

  jobs:
    tfnsw_realtime_pipeline:
      name: tfnsw_realtime_pipeline_${bundle.target}
      max_concurrent_runs: 1
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: poll_duration_seconds
          default: "30"
        - name: poll_interval_seconds
          default: "10"
      environments:
        - environment_key: streaming_env
          spec:
            client: "1"
            dependencies:
              - -r ../requirements.txt
      tasks:
        - task_key: bronze_streaming_ingestion
          max_retries: 0
          notebook_task:
            notebook_path: "../ingestion/bronze/02b Bronze Streaming ingestion.ipynb"
          environment_key: streaming_env
        - task_key: run_realtime_ldp_pipeline
          max_retries: 0
          depends_on:
            - task_key: bronze_streaming_ingestion
          pipeline_task:
            pipeline_id: ${resources.pipelines.tfnsw_ldp_realtime_pipeline.id}
        - task_key: publish_gold_bi_views
          max_retries: 0
          depends_on:
            - task_key: run_realtime_ldp_pipeline
          notebook_task:
            notebook_path: ../notebooks/gold/gold_realtime_bi_views.ipynb