resources:
  pipelines:
    tfnsw_static_pipeline:
      name: tfnsw_static_pipeline_${bundle.target}
      serverless: true
      catalog: ${var.catalog_name}
      target: ${var.schema_name}
      development: ${var.pipeline_dev_mode}
      libraries:
        - file:
            path: ../ldp_pipelines/static/bronze.py
        - file:
            path: ../ldp_pipelines/static/silver.py
      configuration:
        tfnsw.base_landing: "/Volumes/${var.catalog_name}/${var.schema_name}/${var.volume_name}"
        tfnsw.checkpoint_base: "/Volumes/${var.catalog_name}/${var.schema_name}/${var.checkpoint_volume_name}"
        tfnsw.gtfs_modes: ${var.gtfs_modes}
      notifications:
        - email_recipients:
            - ${var.notification_email}
          alerts:
            - on-update-failure
            - on-update-fatal-failure