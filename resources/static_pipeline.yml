resources:
  pipelines:
    tfnsw_ldp_static_pipeline:
      name: tfnsw_ldp_static_pipeline_${bundle.target}
      serverless: true
      catalog: ${var.catalog_name}
      target: ${var.schema_name}
      development: ${var.pipeline_dev_mode}
      libraries:
        - file:
            path: ../ldp_pipelines/static/bronze.py
        - file:
            path: ../ldp_pipelines/static/silver.py
      configuration:
        tfnsw.base_landing: "/Volumes/${var.catalog_name}/${var.schema_name}/${var.volume_name}"
        tfnsw.checkpoint_base: "/Volumes/${var.catalog_name}/${var.schema_name}/${var.checkpoint_volume_name}"
        tfnsw.gtfs_modes: ${var.gtfs_modes}
      notifications:
        - email_recipients:
            - ${var.notification_email}
          alerts:
            - on-update-failure
            - on-update-fatal-failure

  jobs:
    tfnsw_static_refresh:
      name: tfnsw_static_refresh_${bundle.target}
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: storage_account_name
          default: ${var.storage_account_name}
      tasks:
        - task_key: provision_environment
          max_retries: 0
          notebook_task:
            notebook_path: ../commonsetup/00 provision environment.ipynb
        - task_key: download_gtfs_static
          max_retries: 0
          depends_on:
            - task_key: provision_environment
          notebook_task:
            notebook_path: ../download/01 download gtfs static.ipynb
        - task_key: run_static_ldp_pipeline
          max_retries: 0
          depends_on:
            - task_key: download_gtfs_static
          pipeline_task:
            pipeline_id: ${resources.pipelines.tfnsw_ldp_static_pipeline.id}