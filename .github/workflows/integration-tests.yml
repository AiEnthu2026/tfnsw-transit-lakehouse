name: Integration Tests (staging)

on:
  pull_request:
    branches: [staging]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      BUNDLE_VAR_storage_account_name: ${{ secrets.STORAGE_ACCOUNT_NAME }}
      BUNDLE_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.19.0

      - name: Deploy bundle to staging
        run: databricks bundle deploy -t staging

      - name: Run integration tests
        run: databricks bundle run tfnsw_test_suite -t staging --params test_path=integration