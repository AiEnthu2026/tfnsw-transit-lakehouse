name: Unit Tests (dev)

on:
  push:
    branches: [develop]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      BUNDLE_VAR_storage_account_name: ${{ vars.STORAGE_ACCOUNT_NAME }}
      BUNDLE_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to dev
        run: databricks bundle deploy -t dev

      - name: Run unit tests
        run: databricks bundle run tfnsw_test_suite -t dev